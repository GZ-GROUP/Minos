name: Build the PDF engine
description: >
  Builds pdf-engine/ into src-tauri/pdf-engine-dist, which Tauri bundles as a resource.
  The engine bundles Pango to render PDFs, so the build machine needs it. The build
  fails if the result can't convert in both directions.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      id: python
      with:
        python-version: "3.12"

    # `update` refreshes the package index: the one in the runner's image goes stale,
    # and it then asks for files the mirrors no longer have.
    - uses: msys2/setup-msys2@v2
      if: runner.os == 'Windows'
      id: msys2
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-pango

    # Pango's folder is only on the path for this step: MSYS2 also brings its own Python
    # and tools, which mustn't replace the runner's in the steps after this one.
    - name: Build the engine
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        log="$RUNNER_TEMP/pdf-engine.log"
        build() {
          set -e
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
              ;;
            macOS)
              brew install pango
              export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib"
              ;;
          esac
          "$PYTHON" -m pip install -r pdf-engine/requirements.in -r pdf-engine/requirements-dev.txt
          if [ "$RUNNER_OS" = Windows ]; then
            export PATH="$(cygpath -u "$MSYS2_LOCATION")/ucrt64/bin:$PATH"
          fi
          "$PYTHON" pdf-engine/build.py
        }
        if (build) >"$log" 2>&1; then
          tail -n 5 "$log"
        else
          cat "$log"
          # An annotation, so that the cause shows up without opening the full log.
          summary="$(tail -n 12 "$log" | cut -c1-1500 | sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"
          echo "::error title=PDF engine build failed::$summary"
          exit 1
        fi
