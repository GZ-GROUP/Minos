<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Font configuration of the bundled engine on macOS and Linux. Missing folders are skipped. -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>~/.local/share/fonts</dir>
  <dir>~/.fonts</dir>
  <cachedir>~/.cache/minos/fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>Arial</family><family>Liberation Sans</family><family>Helvetica</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Times New Roman</family><family>Liberation Serif</family><family>Times</family><family>DejaVu Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Courier New</family><family>Liberation Mono</family><family>Courier</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
